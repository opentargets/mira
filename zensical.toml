[project]
site_name = "MIRA documentation"
site_description = "Multi-source Indication and Report Analytics"
site_url = "https://opentargets.github.io/mira/"
repo_url = "https://github.com/opentargets/mira"
repo_name = "opentargets/mira"
edit_uri = "edit/main/docs/"
copyright = "Open Targets — Apache 2.0"

nav = [
  { "Home" = "index.md" },
  { "How Mira works" = "concepts.md" },
  { "Data models" = [
    { "Clinical Report" = "clinical-report.md" },
    { "Clinical Indication" = "clinical-indication.md" },
    { "Entity mapping" = "entity-mapping.md" },
  ] },
  { "Using Mira" = [
    { "Generate data with Python" = "generate-with-python.md" },
    { "CLI and YAML configuration" = "cli-and-configuration.md" },
    { "Data inputs" = "data-inputs.md" },
  ] },
  { "Providers" = [
    { "AACT" = "providers/aact.md" },
    { "ChEMBL" = "providers/chembl.md" },
    { "TTD" = "providers/ttd.md" },
    { "EMA" = "providers/ema.md" },
    { "PMDA" = "providers/pmda.md" },
  ] },
]

extra_css = ["assets/stylesheets/extra.css"]

[project.theme]
variant = "modern"
language = "en"
logo = "assets/brand/mira-owl.svg"
favicon = "assets/favicon/favicon.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.quotes.callouts = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
