[project]
name = "opentargets-mira"
version = "1.0.0"
description = "Clinical trial data mining and integration for drug discovery"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Open Targets" }]
requires-python = ">=3.11"
keywords = ["clinical-trials", "drug-discovery", "open-targets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "altair>=5.5.0",
    "connectorx>=0.4.3",
    "fastexcel>=0.16.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "hydra-core>=1.3.2",
    "loguru>=0.7.3",
    "ontoma[ner]>=2.4.1",
    "pandas>=2.3.3",
    "pdfplumber>=0.11.8",
    "polars>=1.34.0",
    "polars-hash>=0.5.5",
    "pyarrow>=22.0.0",
    "pydantic>=2.11.7",
    "sqlalchemy>=2.0.42",
    "openai>=2.37.0",
    "biopython>=1.87",
]

[project.urls]
Homepage = "https://github.com/opentargets/mira"
Repository = "https://github.com/opentargets/mira"
Issues = "https://github.com/opentargets/mira/issues"

[project.scripts]
mira = "mira.cli:main"

[project.optional-dependencies]
oracle = [
    "cx-oracle>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mira"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "ty>=0.0.15",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ipykernel>=6.29.5",
    "pre-commit>=4.6.0",
]

[tool.ruff.lint]
select = ["F", "I"]
